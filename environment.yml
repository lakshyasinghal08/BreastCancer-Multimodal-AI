# ==============================================================================
# Conda Environment Specification for Multimodal Breast Cancer AI Framework
# ==============================================================================
name: bca_multimodal
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.13
  - pip=23.3.1
  - cudatoolkit=12.2
  - pytorch=2.1.2=py3.10_cuda12.1_cudnn8_0
  - torchvision=0.16.2=py310_cu121
  - torchaudio=2.1.2=py310_cu121
  - numpy=1.26.2
  - scipy=1.11.4
  - pandas=2.1.4
  - scikit-learn=1.3.2
  - matplotlib=3.8.2
  - seaborn=0.13.0
  - pillow=10.1.0
  - pyyaml=6.0.1
  - tqdm=4.66.1
  - pip:
      - pydicom==2.4.4
      - SimpleITK==2.3.1
      - opencv-python==4.8.1.78
      - onnx==1.15.0
      - onnxruntime==1.16.3
      - python-docx==1.2.0
      - python-pptx==1.0.2
      - joblib==1.3.2

