# Environment Specification: Multimodal Breast Cancer AI
project_name: Multimodal-Breast-Cancer-AI
version: 1.0.0
date: 2026-11-13

python_environment:
  python_version: 3.10.13
  architecture: x86_64
  operating_system: Linux / Windows 64-bit

deep_learning_stack:
  framework: PyTorch
  version: 2.1.2+cu121
  cuda_version: 12.2
  cudnn_version: 8.9.2
  deterministic: true

reproducibility:
  master_seed: 42
  hash_seed: 42

key_packages:
  numpy: 1.26.2
  scipy: 1.11.4
  pandas: 2.1.4
  scikit-learn: 1.3.2
  matplotlib: 3.8.2
  onnxruntime: 1.16.3
  pydicom: 2.4.4
